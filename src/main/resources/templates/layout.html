<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title layout:title-pattern="$CONTENT_TITLE · $LAYOUT_TITLE" th:text="#{app.name}">Review Buddy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&amp;display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <script th:src="@{/js/tailwind-config.js}"></script>
    <link rel="stylesheet" th:href="@{/webjars/font-awesome/css/all.css}"/>
    <link rel="stylesheet" th:href="@{/css/styles.css}"/>
</head>
<body class="flex min-h-screen flex-col bg-white font-sans leading-relaxed text-black">
<a href="#main-content" class="skip-link">Skip to content</a>
<header class="sticky top-0 z-10 border-b border-line bg-white">
    <div class="mx-auto flex max-w-6xl flex-wrap items-center justify-between gap-x-6 gap-y-2 px-5 py-3 md:min-h-16">
        <a th:href="@{/}" class="flex items-center gap-2 font-heading text-xl font-extrabold">
            <span class="rounded-lg bg-green px-2" aria-hidden="true">★</span>
            <span th:text="#{app.name}">Review Buddy</span>
        </a>
        <button type="button" id="mobile-menu-button" class="rounded-lg border-2 border-black px-3 py-1.5 md:hidden"
                aria-controls="mobile-menu" aria-expanded="false" aria-label="Toggle navigation">
            <i class="fas fa-bars" aria-hidden="true"></i>
        </button>
        <nav id="mobile-menu" aria-label="Main navigation" class="hidden w-full flex-wrap items-center gap-1.5 md:flex md:w-auto">
            <a th:href="@{/}" class="rounded-full px-3 py-2 font-medium hover:bg-green-soft">Home</a>
            <th:block sec:authorize="isAnonymous()">
                <a th:href="@{/login}" class="rounded-full px-3 py-2 font-medium hover:bg-green-soft">Log in</a>
                <a th:href="@{/registration}" class="rounded-full border-2 border-black bg-black px-3.5 py-1.5 text-sm font-semibold text-white hover:bg-neutral-700">Sign up</a>
            </th:block>
            <details sec:authorize="isAuthenticated()" id="user-menu" class="relative max-w-full">
                <summary class="flex cursor-pointer list-none items-center gap-2 rounded-full px-3 py-2 font-medium hover:bg-green-soft">
                    <i class="fas fa-user" aria-hidden="true"></i>
                    <span class="break-all" sec:authentication="principal.name">User</span>
                    <i class="fas fa-chevron-down text-xs" aria-hidden="true"></i>
                </summary>
                <div class="absolute right-0 z-20 mt-2 w-48 rounded-2xl border-2 border-black bg-white p-2">
                    <form method="post" th:action="@{/logout}">
                        <button type="submit" class="w-full rounded-lg px-3 py-2 text-left font-medium hover:bg-green-soft">
                            <i class="fas fa-sign-out-alt mr-2" aria-hidden="true"></i>Log out
                        </button>
                    </form>
                </div>
            </details>
        </nav>
    </div>
</header>

<main id="main-content" class="flex-1" tabindex="-1">
    <div th:if="${successMessage}" class="mx-auto max-w-6xl px-5 pt-6">
        <div class="flex items-start gap-3 rounded-2xl border-2 border-black bg-green-soft p-4" role="status">
            <i class="fas fa-check-circle mt-1" aria-hidden="true"></i>
            <p class="flex-1" th:text="${successMessage}"></p>
            <button type="button" data-dismiss-alert aria-label="Dismiss success message" class="rounded px-1 hover:bg-green">
                <i class="fas fa-times" aria-hidden="true"></i>
            </button>
        </div>
    </div>
    <div th:if="${errorMessage}" class="mx-auto max-w-6xl px-5 pt-6">
        <div class="flex items-start gap-3 rounded-2xl border-2 border-red-700 bg-red-50 p-4 text-red-800" role="alert">
            <i class="fas fa-exclamation-circle mt-1" aria-hidden="true"></i>
            <p class="flex-1" th:text="${errorMessage}"></p>
            <button type="button" data-dismiss-alert aria-label="Dismiss error message" class="rounded px-1 hover:bg-red-100">
                <i class="fas fa-times" aria-hidden="true"></i>
            </button>
        </div>
    </div>
    <div layout:fragment="content"></div>
</main>

<footer class="bg-black py-10 text-white">
    <div class="mx-auto flex max-w-6xl flex-wrap justify-between gap-6 px-5">
        <div>
            <a th:href="@{/}" class="font-heading font-bold"><span aria-hidden="true">★</span> Review Buddy</a>
            <p>Honest reviews for products people built.</p>
        </div>
        <nav aria-label="Footer navigation" class="flex flex-wrap gap-4 text-green">
            <a th:href="@{/}" class="hover:underline">Home</a>
            <a sec:authorize="isAnonymous()" th:href="@{/login}" class="hover:underline">Log in</a>
            <a sec:authorize="isAnonymous()" th:href="@{/registration}" class="hover:underline">Sign up</a>
        </nav>
    </div>
</footer>
<script th:src="@{/js/site.js}"></script>
<script th:src="@{/webjars/htmx.org/dist/htmx.min.js}"></script>
<div layout:fragment="pageScripts"></div>
</body>
</html>
