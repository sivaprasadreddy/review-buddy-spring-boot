<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Server error</title>
</head>
<body>
<div layout:fragment="content">
    <section class="grid min-h-[60vh] place-items-center px-5 py-14 text-center" aria-labelledby="error-title">
        <div class="max-w-lg">
            <h1 id="error-title" class="font-heading text-6xl font-bold">500</h1>
            <h2 class="mt-3 font-heading text-2xl font-bold">Server error</h2>
            <p class="mb-6 mt-2 text-grey">Something went wrong while processing your request. Please try again later.</p>
            <a th:href="@{/}" class="inline-block rounded-full border-2 border-black bg-green px-5 py-2.5 font-semibold hover:bg-green-dark">Back to home</a>
        </div>
    </section>
</div>
</body>
</html>
