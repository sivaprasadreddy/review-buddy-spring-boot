<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Log in</title>
</head>
<body>
<div layout:fragment="content">
    <section class="bg-green-soft px-5 py-14">
        <div class="mx-auto max-w-md rounded-3xl border-2 border-black bg-white p-6 sm:p-8">
            <h1 class="font-heading text-3xl font-bold">Welcome back</h1>
            <div th:if="${param.error}" class="mt-4 rounded-lg border-2 border-red-700 bg-red-50 p-3 text-sm text-red-800" role="alert">
                Invalid email or password.
            </div>
            <div th:if="${message}" class="mt-4 rounded-lg border border-line bg-green-soft p-3" role="status" th:text="${message}"></div>
            <div th:if="${param.logout}" class="mt-4 rounded-lg border border-line bg-green-soft p-3" role="status">
                You have been logged out.
            </div>
            <form id="loginForm" method="post" th:action="@{/login}">
                <label for="username" class="mb-1.5 mt-4 block font-semibold">Email</label>
                <input type="email" id="username" name="username" required autocomplete="email"
                       class="w-full rounded-lg border-2 border-black bg-white px-3.5 py-2.5 focus:outline-none focus:ring-4 focus:ring-green" placeholder="you@example.com"/>
                <label for="password" class="mb-1.5 mt-4 block font-semibold">Password</label>
                <input type="password" id="password" name="password" required autocomplete="current-password"
                       class="w-full rounded-lg border-2 border-black bg-white px-3.5 py-2.5 focus:outline-none focus:ring-4 focus:ring-green"/>
                <button type="submit" class="mt-4 w-full rounded-full border-2 border-black bg-black px-5 py-2.5 font-semibold text-white hover:bg-neutral-700">Log in</button>
            </form>
            <p class="mt-4 text-center text-grey">New here? <a class="underline hover:text-black" th:href="@{/registration}">Create an account</a></p>
        </div>
    </section>
</div>
</body>
</html>
